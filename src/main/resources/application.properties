# Novas configurações para o PostgreSQL local
#postgresql://tcc_transportadora_db_user:Mcne2lwnGgbj9UyuwUSbDu9qZSgny4pq@dpg-d9ov36nqj5pc738e13e0-a/tcc_transportadora_db
spring.datasource.url=jdbc:postgresql://localhost:5432/transportadora_db
spring.datasource.username=postgres
spring.datasource.password=sua_senha_do_postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Informa ao Hibernate/JPA que agora estamos usando o dialeto do Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mantém a recriação/atualização automática das tabelas
spring.jpa.hibernate.ddl-auto=validate

# Ativa o Flyway e ajuda caso o banco já tenha alguma tabela criada antes
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true